<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Vaporwave 1987</title>

<style>
/* ------------------------------
   基本設定
------------------------------ */
body {
  margin: 0;
  font-family: "Courier New", monospace;
  background: linear-gradient(180deg, #ff00ff 0%, #6600ff 40%, #000033 100%);
  color: #e0ffff;
  overflow-x: hidden;
}

/* VHSノイズ */
.vhs-noise {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  background: url('https://upload.wikimedia.org/wikipedia/commons/3/3f/Static.gif');
  opacity: 0.15;
  mix-blend-mode: screen;
  animation: noiseMove 0.3s steps(4) infinite;
}

@keyframes noiseMove {
  0% { transform: translate(0,0); }
  50% { transform: translate(-10px,5px); }
  100% { transform: translate(0,0); }
}

/* スキャンライン（ブラウン管の横線） */
.scanlines {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  background: repeating-linear-gradient(
    to bottom,
    rgba(255,255,255,0.05) 0px,
    rgba(255,255,255,0.05) 2px,
    transparent 3px,
    transparent 4px
  );
  mix-blend-mode: overlay;
}

/* ゆらぐ背景グラデーション */
@keyframes bgMove {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
body {
  background-size: 200% 200%;
  animation: bgMove 12s ease infinite;
}

/* ネオンタイトル（ゆっくり揺れる） */
header {
  text-align: center;
  padding: 80px 20px 20px;
}
header h1 {
  font-size: 4rem;
  letter-spacing: 0.15em;
  color: #ffccff;
  text-shadow:
    0 0 5px #ff00ff,
    0 0 15px #ff00ff,
    0 0 30px #ff00ff,
    0 0 60px #ff00ff;
  animation: float 3s ease-in-out infinite;
}
@keyframes float {
  0% { transform: translateY(0px); }
  50% { transform: translateY(-10px); }
  100% { transform: translateY(0px); }
}

/* Vaporwaveグリッド床 */
.grid {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 40vh;
  background-image:
    linear-gradient(#00ffff55 1px, transparent 1px),
    linear-gradient(90deg, #00ffff55 1px, transparent 1px);
  background-size: 50px 50px;
  transform: perspective(500px) rotateX(70deg);
  opacity: 0.6;
}

/* カード */
.container {
  max-width: 900px;
  margin: 0 auto;
  padding: 20px;
}
.card {
  background: rgba(0,0,0,0.5);
  border: 1px solid #ff99ff;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow:
    0 0 10px #ff00ff55,
    0 0 25px #00ffff33;
}

/* ボタン */
.btn {
  display: inline-block;
  margin-top: 10px;
  padding: 10px 20px;
  border: 1px solid #ff00ff;
  color: #ff00ff;
  text-decoration: none;
  text-transform: uppercase;
  background: rgba(0,0,0,0.7);
  box-shadow:
    0 0 8px #ff00ff88,
    inset 0 0 8px #ff00ff55;
  transition: 0.2s;
}
.btn:hover {
  background: #ff00ff;
  color: #000;
  box-shadow:
    0 0 20px #ff00ff,
    0 0 40px #ff00ff;
}

/* フッター */
footer {
  text-align: center;
  padding: 20px;
  color: #ccccff;
  font-size: 0.8rem;
}
</style>
</head>

<body>

<div class="vhs-noise"></div>
<div class="scanlines"></div>
<div class="grid"></div>

<header>
  <h1>Vaporwave 1987</h1>
  <p>永遠に終わらないピンクの夢。</p>
</header>

<div class="container">
  <section class="card">
    <h2>About</h2>
    <p>このサイトは、80年代のVHSノイズとVaporwaveの美学を融合したレトロフューチャー空間です。</p>
    <a class="btn" href="#music">Music</a>
  </section>

  <section class="card" id="music">
    <h2>Music</h2>
    <p>シンセ、リバーブ、チープな電子音。  
       まるで壊れかけのカセットテープのような音が頭の中でループする。</p>
    <a class="btn" href="#gallery">Gallery</a>
  </section>

  <section class="card" id="gallery">
    <h2>Gallery</h2>
    <p>Vaporwave像、ネオン街、壊れたブラウン管、ピンクの空。  
       好きな画像を追加して、あなたのVaporwave世界を完成させてください。</p>
  </section>
</div>

<footer>
  © 1987–2026 Vaporwave Dreams.
</footer>

</body>
</html>
