<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>宇宙謎解きステーション</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: #ffffff;
      background: radial-gradient(circle at top, #3f51b5 0, #000010 55%, #000000 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .stars {
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(2px 2px at 10% 20%, rgba(255,255,255,0.8), transparent),
        radial-gradient(1px 1px at 80% 30%, rgba(255,255,255,0.6), transparent),
        radial-gradient(1.5px 1.5px at 50% 80%, rgba(255,255,255,0.7), transparent),
        radial-gradient(1px 1px at 20% 70%, rgba(255,255,255,0.5), transparent);
      opacity: 0.6;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 90%;
      max-width: 800px;
      background: rgba(10, 10, 30, 0.85);
      border-radius: 18px;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
      padding: 24px 28px 30px;
      border: 1px solid rgba(120, 180, 255, 0.4);
      backdrop-filter: blur(6px);
    }

    .title {
      text-align: center;
      margin-bottom: 8px;
      letter-spacing: 0.12em;
      font-size: 1.4rem;
      text-transform: uppercase;
      color: #b3e5fc;
    }

    .subtitle {
      text-align: center;
      font-size: 0.9rem;
      color: #e1f5fe;
      margin-bottom: 20px;
    }

    .orbit-line {
      width: 100%;
      height: 1px;
      background: linear-gradient(to right, transparent, #81d4fa, transparent);
      margin: 12px 0 20px;
    }

    .puzzle-card {
      background: rgba(20, 20, 50, 0.9);
      border-radius: 14px;
      padding: 18px 18px 20px;
      border: 1px solid rgba(129, 212, 250, 0.4);
      position: relative;
      overflow: hidden;
    }

    .puzzle-card::before {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 1px dashed rgba(129, 212, 250, 0.35);
      top: -80px;
      right: -60px;
    }

    .puzzle-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: #90caf9;
      margin-bottom: 6px;
    }

    .puzzle-question {
      font-size: 1rem;
      line-height: 1.7;
      margin-bottom: 14px;
    }

    .hint {
      font-size: 0.8rem;
      color: #b0bec5;
      margin-bottom: 12px;
    }

    .input-row {
      display: flex;
      gap: 10px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    input[type="text"] {
      flex: 1;
      min-width: 180px;
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid rgba(144, 202, 249, 0.7);
      background: rgba(5, 5, 25, 0.9);
      color: #ffffff;
      outline: none;
      font-size: 0.9rem;
    }

    input[type="text"]::placeholder {
      color: #78909c;
    }

    button {
      padding: 8px 16px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, #29b6f6, #7e57c2);
      color: #ffffff;
      font-size: 0.9rem;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 0 12px rgba(41, 182, 246, 0.6);
      transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 18px rgba(41, 182, 246, 0.9);
      filter: brightness(1.05);
    }

    .result {
      margin-top: 14px;
      font-size: 0.95rem;
      min-height: 1.2em;
    }

    .result.ok {
      color: #b2ff59;
    }

    .result.ng {
      color: #ffab91;
    }

    .footer {
      margin-top: 22px;
      text-align: center;
      font-size: 0.75rem;
      color: #b0bec5;
    }

    .footer span {
      color: #81d4fa;
    }
  </style>
</head>
<body>
  <div class="stars"></div>

  <div class="container">
    <div class="title">宇宙謎解きステーション</div>
    <div class="subtitle">
      星々に散らばったヒントを集めて、<br>
      ミッションコードを解読せよ。
    </div>

    <div class="orbit-line"></div>

    <div class="puzzle-card">
      <div class="puzzle-label">MISSION 01</div>
      <div class="puzzle-question">
        あなたは宇宙船「オリオン号」の航海士。<br>
        次の3つの天体の頭文字を並べてできる“合言葉”を入力せよ。
        <br><br>
        ・地球の衛星として有名な天体<br>
        ・太陽系で最も大きい惑星<br>
        ・「土星」の英語名
      </div>

      <div class="hint">
        ヒント：<br>
        それぞれの英語名の頭文字をつなげると、3文字のコードになる。<br>
        例）Mars, Venus, Earth → MVE（これは答えではない）
      </div>

      <div class="input-row">
