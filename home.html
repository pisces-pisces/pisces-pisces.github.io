<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Vaporwave VHS Win95 – Ultimate</title>

<style>
/* ============================================================
   強いVaporwaveグラデーション背景（ゆらぐ）
============================================================ */
body {
  margin: 0;
  font-family: "Courier New", monospace;
  background: linear-gradient(180deg, #ff00ff, #cc00ff, #6600ff, #3300ff);
  background-size: 200% 200%;
  animation: bgMove 10s ease infinite;
  color: #e0ffff;
  overflow: hidden;
}
@keyframes bgMove {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* ============================================================
   VHSノイズ＋トラッキングバー
============================================================ */
.vhs-noise {
  position: fixed;
  inset: 0;
  background: url('https://upload.wikimedia.org/wikipedia/commons/3/3f/Static.gif');
  opacity: 0.12;
  mix-blend-mode: screen;
  pointer-events: none;
}

/* トラッキングバー（画面下の白いバー） */
.tracking-bar {
  position: fixed;
  left: 0;
  bottom: 0;
  width: 100%;
  height: 16px;
  background: linear-gradient(
    to top,
    rgba(255,255,255,0.9),
    rgba(255,255,255,0.4),
    transparent
  );
  animation: trackMove 3s linear infinite;
}
@keyframes trackMove {
  0% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
  100% { transform: translateY(0); }
}

/* ============================================================
   CRT湾曲画面（SVGマスク風）
============================================================ */
.crt-wrapper {
  position: fixed;
  inset: 0;
  pointer-events: none;
}
.crt-mask {
  width: 100%;
  height: 100%;
  border-radius: 60px;
  box-shadow:
    inset 0 0 80px rgba(0,0,0,0.9),
    inset 0 0 30px rgba(0,0,0,0.6);
  overflow: hidden;
  transform: scale(1.02);
}

/* ============================================================
   Vaporwave彫刻（左右にゆっくり揺れる）
============================================================ */
.statue {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 280px;
  transform: translate(-50%, -50%);
  opacity: 0.9;
  filter: drop-shadow(0 0 20px #ff00ff);
  animation: statueSwing 6s ease-in-out infinite;
}
@keyframes statueSwing {
  0%   { transform: translate(-50%, -50%) translateX(-10px); }
  50%  { transform: translate(-50%, -50%) translateX(10px); }
  100% { transform: translate(-50%, -50%) translateX(-10px); }
}

/* ============================================================
   カセットテープ（リールだけ回転）
============================================================ */
.tape {
  position: absolute;
  bottom: 40px;
  right: 40px;
  width: 160px;
  height: 100px;
  background: #222;
  border-radius: 8px;
  border: 3px solid #000;
  box-shadow: 0 0 15px #00ffff;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 15px;
}
.reel {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 4px solid #ccc;
  position: relative;
  animation: reelSpin 2s linear infinite;
}
.reel::before,
.reel::after {
  content: "";
  position: absolute;
  inset: 10px;
  border-radius: 50%;
  border: 2px solid #999;
}
@keyframes reelSpin {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}

/* ============================================================
   Windows95 スタートメニュー
============================================================ */
.taskbar {
  position: fixed;
  left: 0;
  bottom: 0;
  width: 100%;
  height: 28px;
  background: #c0c0c0;
  border-top: 2px solid #fff;
  border-left: 2px solid #fff;
  border-right: 2px solid #808080;
  border-bottom: 2px solid #808080;
  display: flex;
  align-items: center;
}
.start-btn {
  margin-left: 4px;
  padding: 4px 12px;
  background: #dcdcdc;
  border-top: 2px solid #fff;
  border-left: 2px solid #fff;
  border-right: 2px solid #808080;
  border-bottom: 2px solid #808080;
  font-size: 0.8rem;
}
.start-btn:active {
  border-top: 2px solid #808080;
  border-left: 2px solid #808080;
  border-right: 2px solid #fff;
  border-bottom: 2px solid #fff;
}

/* スタートメニュー本体（簡易） */
.start-menu {
  position: fixed;
  left: 4px;
  bottom: 28px;
  width: 180px;
  background: #c0c0c0;
  border: 2px solid #000;
  padding: 6px;
  font-size: 0.8rem;
}

/* ============================================================
   Windows95 エラーダイアログ
============================================================ */
.win95-error {
  position: absolute;
  top: 20px;
  left: 20px;
  width: 260px;
  background: #c0c0c0;
  border: 3px solid #000;
  box-shadow: 0 0 20px #000;
}
.win95-title {
  background: #000080;
  color: #fff;
  padding: 6px;
  font-weight: bold;
}
.win95-body {
  padding: 15px;
  background: #e0e0e0;
  border-top: 2px solid #fff;
  border-left: 2px solid #fff;
  border-right: 2px solid #808080;
  border-bottom: 2px solid #808080;
}
.win95-btn {
  display: inline-block;
  padding: 6px 12px;
  margin-top: 10px;
  background: #dcdcdc;
  border-top: 2px solid #fff;
  border-left: 2px solid #fff;
  border-right: 2px solid #808080;
  border-bottom: 2px solid #808080;
  text-decoration: none;
  color: #000;
}
.win95-btn:active {
  border-top: 2px solid #808080;
  border-left: 2px solid #808080;
  border-right: 2px solid #fff;
  border-bottom: 2px solid #fff;
}

/* ============================================================
   ネオンタイトル
============================================================ */
header h1 {
  text-align: center;
  font-size: 3.5rem;
  color: #ffccff;
  text-shadow:
    0 0 5px #ff00ff,
    0 0 15px #ff00ff,
    0 0 30px #ff00ff;
  animation: float 3s ease-in-out infinite;
}
@keyframes float {
  0% { transform: translateY(0px); }
  50% { transform: translateY(-10px); }
  100% { transform: translateY(0px); }
}
</style>
</head>

<body>

<!-- CRT湾曲マスク風ラッパー -->
<div class="crt-wrapper">
  <div class="crt-mask"></div>
</div>

<!-- VHSノイズ＋トラッキングバー -->
<div class="vhs-noise"></div>
<div class="tracking-bar"></div>

<header>
  <h1>Vaporwave VHS Win95 – Ultimate</h1>
</header>

<!-- Vaporwave彫刻（中央） -->
<img class="statue" src="https://assets-cdn.vam.ac.uk/2018/07/25/09/29/36/11ffdbfa-3ec1-489b-bafa-ef0e6fdce6b4/640.jpg">

<!-- カセットテープ（リール回転） -->
<div class="tape">
  <div class="reel"></div>
  <div class="reel"></div>
</div>

<!-- Windows95 エラーダイアログ -->
<div class="win95-error">
  <div class="win95-title">Error</div>
  <div class="win95-body">
    VHS rewind detected.<br>
    System time has been reset to 1995.
    <br><br>
    <a class="win95-btn">OK</a>
  </div>
</div>

<!-- Windows95 タスクバー＋スタートメニュー（常時表示版） -->
<div class="taskbar">
  <div class="start-btn">スタート</div>
</div>
<div class="start-menu">
  Vaporwave<br>
  VHS Player<br>
  Retro Settings<br>
</div>

<!-- VHSの巻き戻し音（サンプル。好みのmp3に差し替え可） -->
<audio autoplay loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" type="audio/mpeg">
</audio>

</body>
</html>
