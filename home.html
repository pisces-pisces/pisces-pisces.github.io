<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Vaporwave VHS Win95 – Infinite Grid</title>

<style>
/* ============================================================
   無限に広がるVaporwave背景
============================================================ */
body {
  margin: 0;
  font-family: "Courier New", monospace;
  background: radial-gradient(circle at center,
    #ff00ff 0%, #cc00ff 20%, #6600ff 50%, #3300ff 80%, #000010 100%);
  background-size: 300% 300%;
  animation: bgMove 20s ease-in-out infinite;
  color: #e0ffff;
  overflow: hidden;
}
@keyframes bgMove {
  0% { background-position: 0% 0%; }
  50% { background-position: 100% 100%; }
  100% { background-position: 0% 0%; }
}

/* ============================================================
   無限グリッド床（Vaporwave）
============================================================ */
.grid-floor {
  position: fixed;
  bottom: -10vh;
  left: 0;
  width: 200%;
  height: 60vh;
  background-image:
    linear-gradient(#00ffff55 1px, transparent 1px),
    linear-gradient(90deg, #00ffff55 1px, transparent 1px);
  background-size: 60px 60px;
  transform: perspective(600px) rotateX(70deg);
  transform-origin: top;
  opacity: 0.7;
  animation: gridMove 12s linear infinite;
}
@keyframes gridMove {
  0% { transform: perspective(600px) rotateX(70deg) translateX(0); }
  100% { transform: perspective(600px) rotateX(70deg) translateX(-200px); }
}

/* ============================================================
   CRT走査線（縦横ライン）
============================================================ */
.scanlines {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.06) 0px,
      rgba(255,255,255,0.06) 2px,
      transparent 3px,
      transparent 4px
    ),
    repeating-linear-gradient(
      to right,
      rgba(255,255,255,0.03) 0px,
      rgba(255,255,255,0.03) 2px,
      transparent 3px,
      transparent 4px
    );
  mix-blend-mode: overlay;
}

/* ============================================================
   VHSノイズ
============================================================ */
.vhs-noise {
  position: fixed;
  inset: 0;
  background: url('https://upload.wikimedia.org/wikipedia/commons/3/3f/Static.gif');
  opacity: 0.12;
  mix-blend-mode: screen;
  pointer-events: none;
}

/* ============================================================
   VHS巻き戻し時の画面ゆがみ
============================================================ */
.rewind-distort {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(
    to bottom,
    rgba(255,255,255,0.2),
    transparent
  );
  mix-blend-mode: screen;
  opacity: 0;
  animation: rewindWarp 10s infinite;
}
@keyframes rewindWarp {
  0%   { opacity: 0; transform: translateX(0) skewX(0deg); }
  40%  { opacity: 0; }
  41%  { opacity: 0.8; transform: translateX(-20px) skewX(20deg); }
  43%  { opacity: 0.4; transform: translateX(10px) skewX(-10deg); }
  45%  { opacity: 0;   transform: translateX(0) skewX(0deg); }
  100% { opacity: 0; }
}

/* ============================================================
   VHSトラッキングバー
============================================================ */
.tracking-bar {
  position: fixed;
  left: 0;
  bottom: 0;
  width: 100%;
  height: 16px;
  background: linear-gradient(
    to top,
    rgba(255,255,255,0.9),
    rgba(255,255,255,0.4),
    transparent
  );
  animation: trackMove 3s linear infinite;
}
@keyframes trackMove {
  0% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
  100% { transform: translateY(0); }
}

/* ============================================================
   Vaporwave彫刻（左右に揺れる）
============================================================ */
.statue {
  position: absolute;
  top: 40%;
  left: 50%;
  width: 260px;
  transform: translate(-50%, -50%);
  opacity: 0.9;
  filter: drop-shadow(0 0 20px #ff00ff);
  animation: statueSwing 6s ease-in-out infinite;
}
@keyframes statueSwing {
  0%   { transform: translate(-50%, -50%) translateX(-10px); }
  50%  { transform: translate(-50%, -50%) translateX(10px); }
  100% { transform: translate(-50%, -50%) translateX(-10px); }
}

/* ============================================================
   カセットテープ（リールだけ回転）
============================================================ */
.tape {
  position: absolute;
  bottom: 60px;
  right: 40px;
  width: 160px;
  height: 100px;
  background: #222;
  border-radius: 8px;
  border: 3px solid #000;
  box-shadow: 0 0 15px #00ffff;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 15px;
}
.reel {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 4px solid #ccc;
  position: relative;
  animation: reelSpin 2s linear infinite;
}
.reel::before,
.reel::after {
  content: "";
  position: absolute;
  inset: 10px;
  border-radius: 50%;
  border: 2px solid #999;
}
@keyframes reelSpin {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}

/* ============================================================
   Win95ウィンドウ（ドラッグ可能）
============================================================ */
.win95-window {
  position: absolute;
  top: 20px;
  left: 20px;
  width: 280px;
  background: #c0c0c0;
  border: 3px solid #000;
  box-shadow: 0 0 20px #000;
}
.win95-title {
  background: #000080;
  color: #fff;
  padding: 6px;
  font-weight: bold;
  cursor: move;
}
.win95-body {
  padding: 15px;
  background: #e0e0e0;
  border-top: 2px solid #fff;
  border-left: 2px solid #fff;
  border-right: 2px solid #808080;
  border-bottom: 2px solid #808080;
}
.win95-btn {
  display: inline-block;
  padding: 6px 12px;
  margin-top: 10px;
  background: #dcdcdc;
  border-top: 2px solid #fff;
  border-left: 2px solid #fff;
  border-right: 2px solid #808080;
  border-bottom: 2px solid #808080;
  text-decoration: none;
  color: #000;
}
.win95-btn:active {
  border-top: 2px solid #808080;
  border-left: 2px solid #808080;
  border-right: 2px solid #fff;
  border-bottom: 2px solid #fff;
}

/* ============================================================
   Win95タスクバー＋スタートメニュー（クリック開閉）
============================================================ */
.taskbar {
  position: fixed;
  left: 0;
  bottom: 0;
  width: 100%;
  height: 28px;
  background: #c0c0c0;
  border-top: 2px solid #fff;
  border-left: 2px solid #fff;
  border-right: 2px solid #808080;
  border-bottom: 2px solid #808080;
  display: flex;
  align-items: center;
}
.start-btn {
  margin-left: 4px;
  padding: 4px 12px;
  background: #dcdcdc;
  border-top: 2px solid #fff;
  border-left: 2px solid #fff;
  border-right: 2px solid #808080;
  border-bottom: 2px solid #808080;
  font-size: 0.8rem;
  cursor: pointer;
}
.start-btn:active {
  border-top: 2px solid #808080;
  border-left: 2px solid #808080;
  border-right: 2px solid #fff;
  border-bottom: 2px solid #fff;
}
.start-menu {
  position: fixed;
  left: 4px;
  bottom: 28px;
  width: 180px;
  background: #c0c0c0;
  border: 2px solid #000;
  padding: 6px;
  font-size: 0.8rem;
  display: none;
}

/* ============================================================
   ネオンタイトル
============================================================ */
header h1 {
  text-align: center;
  font-size: 3.5rem;
  color: #ffccff;
  text-shadow:
    0 0 5px #ff00ff,
    0 0 15px #ff00ff,
    0 0 30px #ff00ff;
  animation: float 3s ease-in-out infinite;
}
@keyframes float {
  0% { transform: translateY(0px); }
  50% { transform: translateY(-10px); }
  100% { transform: translateY(0px); }
}
</style>
</head>

<body>

<div class="grid-floor"></div>
<div class="scanlines"></div>
<div class="vhs-noise"></div>
<div class="rewind-distort"></div>
<div class="tracking-bar"></div>

<header>
  <h1>Vaporwave VHS Win95 – Infinite Grid</h1>
</header>

<!-- Vaporwave彫刻 -->
<img class="statue"
     src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/99/Michelangelo%27s_David_%28replica%29.jpg/480px-Michelangelo%27s_David_%28replica%29.jpg"
     alt="Vaporwave Statue">

<!-- カセットテープ（リール回転） -->
<div class="tape">
  <div class="reel"></div>
  <div class="reel"></div>
</div>

<!-- Win95ウィンドウ（ドラッグ可能） -->
<div id="win95Window" class="win95-window">
  <div id="win95Title" class="win95-title">VHS Control Panel</div>
  <div class="win95-body">
    VHS rewind distortion enabled.<br>
    Infinite grid floor active.<br><br>
    <a class="win95-btn">OK</a>
  </div>
</div>

<!-- Win95タスクバー＋スタートメニュー -->
<div class="taskbar">
  <div class="start-btn" onclick="toggleMenu()">スタート</div>
</div>
<div id="startMenu" class="start-menu">
  Vaporwave<br>
  VHS Player<br>
  Retro Settings<br>
  System 1995<br>
</div>

<!-- VHS巻き戻し音（好みで差し替え可） -->
<audio autoplay loop>
  <source src="https://www.fesliyanstudios.com/play-mp3/387" type="audio/mpeg">
</audio>

<script>
function toggleMenu() {
  const menu = document.getElementById("startMenu");
  menu.style.display = (menu.style.display === "block") ? "none" : "block";
}

/* ドラッグ可能なWin95ウィンドウ */
(function() {
  const win = document.getElementById("win95Window");
  const title = document.getElementById("win95Title");
  let offsetX = 0, offsetY = 0, dragging = false;

  title.addEventListener("mousedown", function(e) {
    dragging = true;
    offsetX = e.clientX - win.offsetLeft;
    offsetY = e.clientY - win.offsetTop;
  });

  document.addEventListener("mousemove", function(e) {
    if (!dragging) return;
    win.style.left = (e.clientX - offsetX) + "px";
    win.style.top  = (e.clientY - offsetY) + "px";
  });

  document.addEventListener("mouseup", function() {
    dragging = false;
  });
})();
</script>

</body>
</html>
